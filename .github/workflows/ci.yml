name: ci

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade build twine
      - run: python -m unittest discover -s tests
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel worker contents
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "workers/document_vlm_common.py",
              "workers/paddleocr_vl/worker.json",
              "workers/paddleocr_vl/adapter.py",
              "workers/ovisocr2/worker.json",
              "workers/ovisocr2/adapter.py",
          }
          forbidden_prefixes = ("workers/glmocr/", "workers/hpd/")
          missing = required - names
          forbidden = sorted(name for name in names if name.startswith(forbidden_prefixes))
          if missing or forbidden:
              raise SystemExit(f"wheel content mismatch: missing={sorted(missing)}, forbidden={forbidden}")
          PY
